title: LSASS Memory Dump via rundll32 comsvcs.dll MiniDump
id: 4c7a9e2f-3b1d-4e58-8c6a-9f0d2b4e6a22
status: stable
description: >
  Detects the canonical credential-dumping pattern: rundll32.exe loading comsvcs.dll
  and invoking MiniDump against lsass (well-documented LOLBin technique).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Philopater Shenouda (Ph.Sh-Packs)
date: 2026-11-06
logsource:
  category: process_creation
  product: windows
detection:
  sel_img:
    Image|endswith: '\rundll32.exe'
  sel_args:
    CommandLine|contains|all:
      - 'comsvcs.dll'
      - 'MiniDump'
  condition: sel_img and sel_args
falsepositives:
  - Rare; legitimate forensic collection tooling doing the same call pattern
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
